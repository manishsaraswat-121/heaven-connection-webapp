  <circle cx="90" cy="82" r="2" fill="#d4af37"/>
  <circle cx="105" cy="78" r="2" fill="#d4af37"/>
  <circle cx="120" cy="82" r="2" fill="#d4af37"/>
  <circle cx="135" cy="78" r="2" fill="#d4af37"/>
  <!-- Floral decoration top -->
  <circle cx="100" cy="42" r="8" fill="#d4af37" opacity="0.8"/>
  <circle cx="100" cy="42" r="4" fill="#ffd700"/>
  <circle cx="92" cy="44" r="4" fill="#d4af37" opacity="0.6"/>
  <circle cx="108" cy="44" r="4" fill="#d4af37" opacity="0.6"/>
  <circle cx="96" cy="36" r="4" fill="#d4af37" opacity="0.6"/>
  <circle cx="104" cy="36" r="4" fill="#d4af37" opacity="0.6"/>
