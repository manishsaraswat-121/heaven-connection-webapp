  <line x1="70" y1="115" x2="70" y2="140" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="115" x2="100" y2="140" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="115" x2="130" y2="140" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.1"/>
