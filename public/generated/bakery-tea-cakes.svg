  <path d="M158 102 Q160 96 158 90" stroke="#d0c8b8" stroke-width="1" fill="none" opacity="0.5"/>
  <defs>
    <linearGradient id="tgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
