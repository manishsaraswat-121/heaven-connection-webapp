  <line x1="55" y1="120" x2="145" y2="120" stroke="#3a1f0a" stroke-width="0.8" opacity="0.4"/>
  <defs>
    <linearGradient id="bgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.08"/>
